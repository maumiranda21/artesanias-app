<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>creatiyés | Catálogo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; letter-spacing: -0.01em; }
        h1, h2, h3, h4 { line-height: 1.15; }
        .fade-in { animation: fadeIn 0.25s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @media (prefers-reduced-motion: reduce) { .fade-in { animation: none; } }
        button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid #1c1917; outline-offset: 2px; }
        .pb-safe { padding-bottom: max(0.75rem, env(safe-area-inset-bottom)); }
    </style>
</head>
<body class="bg-white text-stone-900 min-h-screen">

    <!-- Logo centrado -->
    <header class="pt-10 pb-6 flex justify-center">
        <div class="cursor-pointer" onclick="cambiarVista('catalogo')">
            <img src="https://mprojuxphdxyvghqoynv.supabase.co/storage/v1/object/public/productos/logo_creatiyes.png" alt="creatiyés" class="h-16 sm:h-20 object-contain" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1590736969955-71cc94901144?auto=format&fit=crop&w=200&q=80';">
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 pb-28">

        <!-- CATÁLOGO PÚBLICO -->
        <section id="vista-catalogo" class="space-y-10 fade-in">
            <div class="flex flex-wrap justify-center gap-x-6 gap-y-2" id="filtros-categorias"></div>
            <div id="grid-productos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-12">
                <div class="col-span-full text-center py-16 text-stone-400 text-sm">Cargando piezas…</div>
            </div>
        </section>

        <!-- PANEL ADMIN -->
        <section id="vista-admin" class="hidden space-y-8 fade-in">
            <!-- Login -->
            <div id="admin-login" class="max-w-sm mx-auto pt-6 space-y-6">
                <div class="text-center space-y-1">
                    <h2 class="text-xl font-semibold">Acceso administrador</h2>
                    <p class="text-sm text-stone-500">Ingresa con tu correo y contraseña.</p>
                </div>
                <form onsubmit="iniciarSesionAdmin(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm text-stone-600 mb-1" for="login-email">Correo electrónico</label>
                        <input type="email" id="login-email" required class="w-full px-3 py-2.5 rounded-md border border-stone-300 focus:border-stone-900 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm text-stone-600 mb-1" for="login-password">Contraseña</label>
                        <input type="password" id="login-password" required class="w-full px-3 py-2.5 rounded-md border border-stone-300 focus:border-stone-900 focus:outline-none">
                    </div>
                    <button type="submit" class="w-full py-3 bg-stone-900 text-white text-sm font-medium rounded-md hover:bg-stone-700 transition">Iniciar sesión</button>
                </form>
            </div>

            <!-- Dashboard -->
            <div id="admin-dashboard" class="hidden space-y-8">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 pb-6 border-b border-stone-200">
                    <div>
                        <h2 class="text-xl font-semibold">Panel de control</h2>
                        <p class="text-sm text-stone-500" id="admin-user-email"></p>
                    </div>
                    <button onclick="cerrarSesionAdmin()" class="px-4 py-2 text-sm border border-stone-300 rounded-md hover:bg-stone-50 transition">Cerrar sesión</button>
                </div>

                <div class="flex space-x-6 border-b border-stone-200">
                    <button onclick="cambiarPestanaAdmin('inventario')" id="tab-inventario" class="pb-3 -mb-px border-b-2 border-stone-900 font-semibold text-sm">Inventario</button>
                    <button onclick="cambiarPestanaAdmin('ventas')" id="tab-ventas" class="pb-3 -mb-px border-b-2 border-transparent text-stone-500 hover:text-stone-900 text-sm">Ventas</button>
                </div>

                <!-- Inventario -->
                <div id="panel-inventario" class="space-y-4">
                    <div class="flex justify-between items-center">
                        <h3 class="text-base font-semibold">Inventario</h3>
                        <button onclick="abrirModalProducto()" class="px-4 py-2 bg-stone-900 text-white text-sm font-medium rounded-md hover:bg-stone-700 transition">Nuevo producto</button>
                    </div>
                    <div class="overflow-x-auto border border-stone-200 rounded-md">
                        <table class="w-full text-left border-collapse min-w-[640px]">
                            <thead>
                                <tr class="border-b border-stone-200 text-xs text-stone-500">
                                    <th class="p-4 font-medium">Pieza</th>
                                    <th class="p-4 font-medium">Categoría</th>
                                    <th class="p-4 font-medium">Precio</th>
                                    <th class="p-4 font-medium">Estado</th>
                                    <th class="p-4 font-medium text-right">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-inventario-body" class="divide-y divide-stone-100 text-sm"></tbody>
                        </table>
                    </div>
                </div>

                <!-- Ventas -->
                <div id="panel-ventas" class="hidden space-y-4">
                    <h3 class="text-base font-semibold">Registro de ventas</h3>
                    <div class="overflow-x-auto border border-stone-200 rounded-md">
                        <table class="w-full text-left border-collapse min-w-[480px]">
                            <thead>
                                <tr class="border-b border-stone-200 text-xs text-stone-500">
                                    <th class="p-4 font-medium">Fecha</th>
                                    <th class="p-4 font-medium">Producto</th>
                                    <th class="p-4 font-medium">Precio final</th>
                                    <th class="p-4 font-medium">Estado</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-ventas-body" class="divide-y divide-stone-100 text-sm"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Navegación inferior -->
    <nav class="fixed bottom-0 inset-x-0 z-40 bg-white/95 backdrop-blur border-t border-stone-200 pt-3 pb-safe">
        <div class="flex justify-center space-x-10">
            <button onclick="cambiarVista('catalogo')" id="btn-catalogo" class="text-sm font-semibold text-stone-900 border-b-2 border-stone-900 pb-1 transition">Catálogo</button>
            <button onclick="cambiarVista('admin')" id="btn-admin" class="text-sm font-medium text-stone-500 border-b-2 border-transparent pb-1 hover:text-stone-900 transition">Panel</button>
        </div>
    </nav>

    <!-- Modal producto -->
    <div id="modal-producto" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50 p-4">
        <div class="bg-white w-full max-w-lg rounded-lg p-7 space-y-5 shadow-xl max-h-[90vh] overflow-y-auto fade-in">
            <h3 id="modal-titulo" class="text-lg font-semibold">Nuevo producto</h3>
            <form id="form-producto" onsubmit="guardarProducto(event)" class="space-y-4">
                <input type="hidden" id="prod-id">
                <div>
                    <label class="block text-sm text-stone-600 mb-1" for="prod-fotos">Fotografías</label>
                    <input type="file" id="prod-fotos" multiple accept="image/*" onchange="analizarNombreArchivoIA(event)" class="w-full text-sm text-stone-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-medium file:bg-stone-100 file:text-stone-700 hover:file:bg-stone-200">
                    <p id="ia-estado" class="text-xs text-stone-400 mt-1.5 hidden">Leyendo nombre de archivo…</p>
                </div>
                <div>
                    <label class="block text-sm text-stone-600 mb-1" for="prod-nombre">Nombre</label>
                    <input type="text" id="prod-nombre" required class="w-full px-3 py-2.5 rounded-md border border-stone-300 focus:border-stone-900 focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm text-stone-600 mb-1" for="prod-categoria">Categoría</label>
                        <input type="text" id="prod-categoria" required class="w-full px-3 py-2.5 rounded-md border border-stone-300 focus:border-stone-900 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm text-stone-600 mb-1" for="prod-precio">Precio</label>
                        <input type="number" step="0.01" id="prod-precio" required class="w-full px-3 py-2.5 rounded-md border border-stone-300 focus:border-stone-900 focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-sm text-stone-600 mb-1" for="prod-coleccion">Colección (opcional)</label>
                    <input type="text" id="prod-coleccion" class="w-full px-3 py-2.5 rounded-md border border-stone-300 focus:border-stone-900 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm text-stone-600 mb-1" for="prod-descripcion">Descripción</label>
                    <textarea id="prod-descripcion" rows="3" class="w-full px-3 py-2.5 rounded-md border border-stone-300 focus:border-stone-900 focus:outline-none"></textarea>
                </div>
                <div>
                    <label class="block text-sm text-stone-600 mb-1" for="prod-estado">Estado</label>
                    <select id="prod-estado" class="w-full px-3 py-2.5 rounded-md border border-stone-300 focus:border-stone-900 focus:outline-none bg-white">
                        <option value="disponible">Disponible</option>
                        <option value="reservado">Reservado</option>
                        <option value="vendido">Vendido</option>
                    </select>
                </div>
                <div class="flex justify-end space-x-3 pt-4 border-t border-stone-100">
                    <button type="button" onclick="cerrarModalProducto()" class="px-5 py-2.5 border border-stone-300 rounded-md text-sm text-stone-600 hover:bg-stone-50 transition">Cancelar</button>
                    <button type="submit" id="btn-guardar-prod" class="px-6 py-2.5 bg-stone-900 text-white rounded-md text-sm font-medium hover:bg-stone-700 transition disabled:opacity-60">Guardar producto</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal zoom -->
    <div id="modal-zoom" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 p-4" onclick="cerrarZoom()">
        <div class="relative max-w-4xl max-h-[90vh]">
            <img id="img-zoom-src" src="" alt="" class="max-w-full max-h-[85vh] rounded-md object-contain">
            <button class="absolute top-3 right-3 bg-white/20 hover:bg-white/40 text-white text-xl w-10 h-10 rounded-full flex items-center justify-center transition" aria-label="Cerrar">×</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://mprojuxphdxyvghqoynv.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_OVwdEUSZNt9en94i-g-Ulw_QuwLT901';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let productosGlobal = [];
        let categoriaActual = 'todos';
        let carruselIndices = {};

        const $ = (id) => document.getElementById(id);
        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        document.addEventListener('DOMContentLoaded', () => {
            verificarSesionReal();
            cargarCatalogoPublico();
        });

        async function verificarSesionReal() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                $('admin-login').classList.add('hidden');
                $('admin-dashboard').classList.remove('hidden');
                $('admin-user-email').innerText = `Conectado como ${session.user.email}`;
                cargarInventarioAdmin();
                cargarVentasAdmin();
            } else {
                $('admin-login').classList.remove('hidden');
                $('admin-dashboard').classList.add('hidden');
            }
        }

        async function iniciarSesionAdmin(e) {
            e.preventDefault();
            const email = $('login-email').value;
            const password = $('login-password').value;
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) alert('Correo o contraseña incorrectos.');
            else verificarSesionReal();
        }

        async function cerrarSesionAdmin() {
            await supabaseClient.auth.signOut();
            verificarSesionReal();
            cambiarVista('catalogo');
        }

        function cambiarVista(vista) {
            const activo = 'text-sm font-semibold text-stone-900 border-b-2 border-stone-900 pb-1 transition';
            const inactivo = 'text-sm font-medium text-stone-500 border-b-2 border-transparent pb-1 hover:text-stone-900 transition';
            if (vista === 'catalogo') {
                $('vista-catalogo').classList.remove('hidden');
                $('vista-admin').classList.add('hidden');
                $('btn-catalogo').className = activo;
                $('btn-admin').className = inactivo;
                cargarCatalogoPublico();
            } else {
                $('vista-catalogo').classList.add('hidden');
                $('vista-admin').classList.remove('hidden');
                $('btn-admin').className = activo;
                $('btn-catalogo').className = inactivo;
                verificarSesionReal();
            }
            window.scrollTo({ top: 0 });
        }

        async function cargarCatalogoPublico() {
            const grid = $('grid-productos');
            const { data, error } = await supabaseClient.from('products').select('*').order('created_at', { ascending: false });
            if (error) {
                grid.innerHTML = `<div class="col-span-full text-center py-16 text-red-600 text-sm">No se pudieron cargar los productos: ${esc(error.message)}</div>`;
                return;
            }
            productosGlobal = data || [];
            actualizarFiltrosCategorias();
            renderizarProductos();
        }

        function actualizarFiltrosCategorias() {
            const categorias = ['todos', ...new Set(productosGlobal.map(p => p.category).filter(Boolean))];
            $('filtros-categorias').innerHTML = categorias.map(cat => `
                <button data-cat="${esc(cat)}" class="text-sm pb-1 border-b-2 transition ${categoriaActual === cat ? 'border-stone-900 text-stone-900 font-semibold' : 'border-transparent text-stone-500 hover:text-stone-900'}">
                    ${esc(cat === 'todos' ? 'Todas' : cat.charAt(0).toUpperCase() + cat.slice(1))}
                </button>
            `).join('');
            $('filtros-categorias').querySelectorAll('button').forEach(b => b.addEventListener('click', () => filtrarCategoria(b.dataset.cat)));
        }

        function filtrarCategoria(cat) {
            categoriaActual = cat;
            actualizarFiltrosCategorias();
            renderizarProductos();
        }

        function fotosDe(p) {
            if (Array.isArray(p.images) && p.images.length > 0) return p.images;
            if (p.main_image) return [p.main_image];
            return ['https://images.unsplash.com/photo-1590736969955-71cc94901144?auto=format&fit=crop&w=800&q=80'];
        }

        function renderizarProductos() {
            const grid = $('grid-productos');
            const filtrados = categoriaActual === 'todos' ? productosGlobal : productosGlobal.filter(p => p.category === categoriaActual);

            if (filtrados.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-16 text-stone-400 text-sm">No hay piezas en esta categoría.</div>';
                return;
            }

            grid.innerHTML = filtrados.map(p => {
                const fotos = fotosDe(p);
                if (carruselIndices[p.id] === undefined) carruselIndices[p.id] = 0;
                let idx = carruselIndices[p.id];
                if (idx >= fotos.length) idx = 0;

                const badge = p.status === 'vendido' ? '<span class="absolute top-3 left-3 bg-white text-stone-900 text-xs font-medium px-2.5 py-1 rounded-md">Vendido</span>'
                            : p.status === 'reservado' ? '<span class="absolute top-3 left-3 bg-white text-stone-900 text-xs font-medium px-2.5 py-1 rounded-md">Reservado</span>' : '';

                const controles = fotos.length > 1 ? `
                    <button onclick="cambiarFoto('${esc(p.id)}', -1, event)" aria-label="Foto anterior" class="absolute left-2 top-1/2 -translate-y-1/2 bg-white/90 hover:bg-white text-stone-900 w-8 h-8 rounded-full flex items-center justify-center z-20">‹</button>
                    <button onclick="cambiarFoto('${esc(p.id)}', 1, event)" aria-label="Foto siguiente" class="absolute right-2 top-1/2 -translate-y-1/2 bg-white/90 hover:bg-white text-stone-900 w-8 h-8 rounded-full flex items-center justify-center z-20">›</button>
                    <div class="absolute bottom-3 right-3 bg-white/90 text-stone-900 text-xs px-2 py-0.5 rounded-md z-10">${idx + 1}/${fotos.length}</div>` : '';

                return `
                    <article class="flex flex-col">
                        <div class="relative aspect-[4/5] bg-stone-100 overflow-hidden rounded-md">
                            <img src="${esc(fotos[idx])}" alt="${esc(p.name)}" class="w-full h-full object-cover cursor-zoom-in" onclick="abrirZoom('${esc(fotos[idx])}')">
                            ${badge}
                            ${controles}
                        </div>
                        <div class="pt-4 space-y-1">
                            <p class="text-xs text-stone-400">${esc(p.category || 'General')}</p>
                            <h3 class="text-base font-semibold">${esc(p.name)}</h3>
                            <p class="text-sm text-stone-500 line-clamp-2">${esc(p.description || 'Pieza artesanal única elaborada a mano.')}</p>
                            <div class="flex items-center justify-between pt-3">
                                <span class="text-lg font-semibold">$ ${Number(p.price).toFixed(2)}</span>
                                <button data-id="${esc(p.id)}" class="btn-quiero px-4 py-2 border border-stone-900 text-stone-900 hover:bg-stone-900 hover:text-white text-sm font-medium rounded-md transition">Quiero este</button>
                            </div>
                        </div>
                    </article>`;
            }).join('');

            grid.querySelectorAll('.btn-quiero').forEach(b => b.addEventListener('click', () => {
                const p = productosGlobal.find(x => String(x.id) === b.dataset.id);
                if (p) accionQuieroEste(p);
            }));
        }

        function cambiarFoto(idProd, direccion, event) {
            event.stopPropagation();
            const p = productosGlobal.find(x => String(x.id) === String(idProd));
            if (!p) return;
            const total = fotosDe(p).length;
            let i = (carruselIndices[p.id] || 0) + direccion;
            if (i < 0) i = total - 1;
            if (i >= total) i = 0;
            carruselIndices[p.id] = i;
            renderizarProductos();
        }

        function abrirZoom(url) {
            $('img-zoom-src').src = url;
            $('modal-zoom').classList.remove('hidden');
            $('modal-zoom').classList.add('flex');
        }
        function cerrarZoom() {
            $('modal-zoom').classList.add('hidden');
            $('modal-zoom').classList.remove('flex');
        }

        function accionQuieroEste(p) {
            const texto = `Hola, quiero este producto:\n- *${p.name}*\n- Categoría: ${p.category || '-'}\n- Precio: $${Number(p.price).toFixed(2)}\n- Descripción: ${p.description || ''}\n\n¿Está disponible?`;
            const url = `https://wa.link/3qk34n?text=${encodeURIComponent(texto)}`;
            const abrir = () => window.open(url, '_blank');
            if (navigator.clipboard) {
                navigator.clipboard.writeText(texto).then(() => {
                    alert('Información copiada. Se abrirá WhatsApp para que envíes el mensaje.');
                    abrir();
                }).catch(abrir);
            } else abrir();
        }

        // Autocompleta nombre/descr. a partir del nombre del archivo
        function analizarNombreArchivoIA(e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;
            const estado = $('ia-estado');
            estado.classList.remove('hidden');

            let nombre = files[0].name.replace(/\.[^/.]+$/, '').replace(/[_.-]/g, ' ');
            nombre = nombre.charAt(0).toUpperCase() + nombre.slice(1);

            setTimeout(() => {
                if (!$('prod-nombre').value) $('prod-nombre').value = nombre;
                if (!$('prod-categoria').value) $('prod-categoria').value = 'Artesanía';
                if (!$('prod-descripcion').value) $('prod-descripcion').value = `Pieza exclusiva "${nombre}" elaborada artesanalmente con acabados tradicionales.`;
                estado.classList.add('hidden');
            }, 300);
        }

        function cambiarPestanaAdmin(tab) {
            $('panel-inventario').classList.add('hidden');
            $('panel-ventas').classList.add('hidden');
            $('tab-inventario').className = 'pb-3 -mb-px border-b-2 border-transparent text-stone-500 hover:text-stone-900 text-sm';
            $('tab-ventas').className = 'pb-3 -mb-px border-b-2 border-transparent text-stone-500 hover:text-stone-900 text-sm';
            $(`panel-${tab}`).classList.remove('hidden');
            $(`tab-${tab}`).className = 'pb-3 -mb-px border-b-2 border-stone-900 font-semibold text-sm';
        }

        async function cargarInventarioAdmin() {
            const tbody = $('tabla-inventario-body');
            const { data } = await supabaseClient.from('products').select('*').order('created_at', { ascending: false });
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="p-6 text-center text-stone-400">Aún no hay productos. Agrega el primero con “Nuevo producto”.</td></tr>';
                return;
            }
            tbody.innerHTML = data.map(p => `
                <tr class="hover:bg-stone-50">
                    <td class="p-4">
                        <div class="flex items-center space-x-3">
                            <img src="${esc(p.main_image || (p.images && p.images[0]) || 'https://via.placeholder.com/40')}" alt="" class="w-12 h-12 rounded-md object-cover border border-stone-200">
                            <span class="font-medium">${esc(p.name)}</span>
                        </div>
                    </td>
                    <td class="p-4 text-stone-600">${esc(p.category || '-')}</td>
                    <td class="p-4 font-medium">$ ${Number(p.price).toFixed(2)}</td>
                    <td class="p-4"><span class="text-xs font-medium px-2.5 py-1 rounded-md ${p.status === 'vendido' ? 'bg-stone-900 text-white' : p.status === 'reservado' ? 'bg-stone-200 text-stone-800' : 'bg-stone-100 text-stone-600'}">${esc(p.status)}</span></td>
                    <td class="p-4 text-right space-x-2 whitespace-nowrap">
                        ${p.status !== 'vendido' ? `<button onclick="marcarComoVendido('${esc(p.id)}')" class="text-xs px-3 py-1.5 border border-stone-300 rounded-md hover:bg-stone-50">Marcar vendido</button>` : ''}
                        <button onclick="editarProducto('${esc(p.id)}')" class="text-xs px-3 py-1.5 border border-stone-300 rounded-md hover:bg-stone-50">Editar</button>
                        <button onclick="eliminarProducto('${esc(p.id)}')" class="text-xs px-3 py-1.5 border border-stone-300 text-red-600 rounded-md hover:bg-red-50">Eliminar</button>
                    </td>
                </tr>
            `).join('');
        }

        async function marcarComoVendido(id) {
            const { error } = await supabaseClient.from('products').update({ status: 'vendido' }).eq('id', id);
            if (error) { alert('No se pudo actualizar el estado: ' + error.message); return; }
            await supabaseClient.from('sales').insert([{
                product_id: id,
                sale_price: 0,
                status: 'completada',
                observations: 'Marcado como vendido desde acción rápida'
            }]);
            cargarInventarioAdmin();
            cargarVentasAdmin();
        }

        async function cargarVentasAdmin() {
            const tbody = $('tabla-ventas-body');
            const { data } = await supabaseClient.from('sales').select('*, products(name)').order('created_at', { ascending: false });
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="p-6 text-center text-stone-400">Aún no hay ventas registradas.</td></tr>';
                return;
            }
            tbody.innerHTML = data.map(v => `
                <tr class="hover:bg-stone-50">
                    <td class="p-4 text-stone-600">${new Date(v.created_at).toLocaleDateString()}</td>
                    <td class="p-4 font-medium">${esc(v.products?.name || 'Pieza eliminada')}</td>
                    <td class="p-4 font-medium">$ ${Number(v.sale_price).toFixed(2)}</td>
                    <td class="p-4"><span class="text-xs font-medium px-2.5 py-1 rounded-md bg-stone-100 text-stone-600">${esc(v.status)}</span></td>
                </tr>
            `).join('');
        }

        function abrirModalProducto() {
            $('modal-titulo').innerText = 'Nuevo producto';
            $('form-producto').reset();
            $('prod-id').value = '';
            $('btn-guardar-prod').disabled = false;
            $('btn-guardar-prod').innerText = 'Guardar producto';
            $('modal-producto').classList.remove('hidden');
            $('modal-producto').classList.add('flex');
        }
        function cerrarModalProducto() {
            $('modal-producto').classList.add('hidden');
            $('modal-producto').classList.remove('flex');
        }

        // GUARDADO: ahora todo va dentro de try/catch/finally, así el botón
        // nunca se queda trabado aunque algo falle.
        async function guardarProducto(e) {
            e.preventDefault();
            const btn = $('btn-guardar-prod');
            btn.disabled = true;
            btn.innerText = 'Guardando…';

            try {
                const id = $('prod-id').value;
                const productoData = {
                    name: $('prod-nombre').value.trim(),
                    category: $('prod-categoria').value.trim(),
                    price: parseFloat($('prod-precio').value),
                    collection_name: ($('prod-coleccion').value || '').trim() || 'General',
                    description: $('prod-descripcion').value.trim(),
                    status: $('prod-estado').value
                };

                // Subida de fotos, una por una
                const files = $('prod-fotos').files;
                const imageUrls = [];
                const fallos = [];
                for (let i = 0; i < files.length; i++) {
                    btn.innerText = `Subiendo foto ${i + 1} de ${files.length}…`;
                    const file = files[i];
                    const limpio = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
                    const filePath = `uploads/${Date.now()}_${Math.random().toString(36).slice(2)}_${limpio}`;
                    const { error: upErr } = await supabaseClient.storage.from('productos').upload(filePath, file);
                    if (upErr) { fallos.push(`${file.name}: ${upErr.message}`); continue; }
                    const { data: pub } = supabaseClient.storage.from('productos').getPublicUrl(filePath);
                    if (pub && pub.publicUrl) imageUrls.push(pub.publicUrl);
                }

                if (fallos.length > 0) {
                    const seguir = confirm(`No se pudieron subir ${fallos.length} foto(s):\n\n${fallos.join('\n')}\n\n¿Guardar el producto de todos modos?`);
                    if (!seguir) return;
                }

                if (imageUrls.length > 0) {
                    productoData.images = imageUrls;
                    productoData.main_image = imageUrls[0];
                }

                btn.innerText = 'Guardando…';
                const res = id
                    ? await supabaseClient.from('products').update(productoData).eq('id', id)
                    : await supabaseClient.from('products').insert([productoData]);

                if (res.error) throw res.error;

                cerrarModalProducto();
                cargarInventarioAdmin();
                cargarCatalogoPublico();
            } catch (err) {
                console.error(err);
                alert('No se pudo guardar: ' + (err.message || err));
            } finally {
                btn.disabled = false;
                btn.innerText = $('prod-id').value ? 'Guardar cambios' : 'Guardar producto';
            }
        }

        async function editarProducto(id) {
            const { data } = await supabaseClient.from('products').select('*').eq('id', id).single();
            if (!data) return;

            $('modal-titulo').innerText = 'Editar producto';
            $('prod-id').value = data.id;
            $('prod-nombre').value = data.name;
            $('prod-categoria').value = data.category || '';
            $('prod-precio').value = data.price;
            $('prod-coleccion').value = data.collection_name || '';
            $('prod-descripcion').value = data.description || '';
            $('prod-estado').value = data.status;
            $('prod-fotos').value = '';

            $('btn-guardar-prod').disabled = false;
            $('btn-guardar-prod').innerText = 'Guardar cambios';
            $('modal-producto').classList.remove('hidden');
            $('modal-producto').classList.add('flex');
        }

        async function eliminarProducto(id) {
            if (!confirm('¿Eliminar este producto del inventario?')) return;
            const { error } = await supabaseClient.from('products').delete().eq('id', id);
            if (error) { alert('No se pudo eliminar: ' + error.message); return; }
            cargarInventarioAdmin();
            cargarCatalogoPublico();
        }
    </script>
</body>
